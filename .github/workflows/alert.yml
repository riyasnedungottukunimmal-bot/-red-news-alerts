name: Red news alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test alert only"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: red-news
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for red news
        env:
          NTFY_TOPIC: "YOUR-TOPIC-NAME"
          TEST: ${{ github.event.inputs.test }}
          CURRENCIES: ""
          LEAD_MINUTES: "30,5"
          TIMEZONE: "UTC"
        run: python alert.py

      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
